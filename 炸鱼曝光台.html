<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>炸鱼观察记录</title>
<style>
  :root {
    --bg-deep: #0a0a0f;
    --bg-card: #111118;
    --bg-card-hover: #16161f;
    --red: #FF4655;
    --red-dim: rgba(255,70,85,0.5);
    --cyan: #00e5ff;
    --green: #4ade80;
    --amber: #ffb347;
    --steel: #7b8594;
    --text: #d0d0d6;
    --text-dim: #6b7280;
    --border: rgba(255,255,255,0.06);
    --border-active: rgba(255,70,85,0.3);
    --font: "PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",sans-serif;
    --font-mono: "SF Mono","Cascadia Code","Consolas","Source Code Pro",monospace;
    --gap: 20px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg-deep);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;text-wrap:pretty}
  body{min-height:100vh;position:relative;overflow-x:hidden}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px)}
  .grid-bg{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(255,70,85,0.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,70,85,0.022) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 70% 70% at 50% 30%,black 20%,transparent 80%)}
  .container{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:48px var(--gap) 80px}

  /* ── Header ── */
  .site-header{margin-bottom:36px;padding-bottom:24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .header-left{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .site-header h1{font-size:clamp(24px,4vw,32px);font-weight:900;letter-spacing:1px;color:#fff}
  .site-header h1 .accent{color:var(--red)}
  .site-header .meta{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);letter-spacing:1px}
  .site-header .meta strong{color:var(--red);font-weight:700}
  .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .header-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .header-dot.online{background:var(--green);box-shadow:0 0 6px rgba(74,222,128,0.5)}
  .header-dot.offline{background:var(--text-dim)}
  .btn-hdr{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:var(--text-dim);background:none;border:1px solid rgba(255,255,255,0.1);padding:5px 12px;cursor:pointer;transition:border-color .2s,color .2s;white-space:nowrap}
  .btn-hdr:hover{border-color:var(--red-dim);color:#fff}
  .btn-hdr.gh-active{border-color:rgba(74,222,128,0.4);color:var(--green)}
  .btn-icon{width:32px;height:32px;display:grid;place-items:center;background:none;border:1px solid rgba(255,255,255,0.1);color:var(--text-dim);cursor:pointer;font-size:15px;transition:border-color .2s,color .2s}
  .btn-icon:hover{border-color:var(--red-dim);color:#fff}

  /* ── 瀑布流 ── */
  .masonry{display:flex;gap:var(--gap);align-items:flex-start}
  .masonry-col{display:flex;flex-direction:column;gap:var(--gap);flex:1;min-width:0}

  /* ── 卡片 ── */
  .record-card{background:var(--bg-card);border:1px solid var(--border);position:relative;clip-path:polygon(0% 0%,100% 0%,100% calc(100% - 8px),calc(100% - 8px) 100%,0% 100%,0% 0%);transition:border-color .2s,background .2s;overflow:hidden}
  .record-card:hover{border-color:var(--border-active);background:var(--bg-card-hover)}
  .record-card::before{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--red);opacity:0;transition:opacity .2s;z-index:1}
  .record-card:hover::before{opacity:1}
  .record-card.is-draft{border-color:rgba(255,179,71,0.25)}
  .card-draft-tag{position:absolute;top:10px;right:12px;font-family:var(--font-mono);font-size:9px;letter-spacing:2px;color:var(--amber);background:rgba(255,179,71,0.1);padding:3px 8px;pointer-events:none;z-index:2}
  .card-top{display:flex;align-items:baseline;gap:14px;padding:18px 20px 0;flex-wrap:wrap}
  .card-date{font-family:var(--font-mono);font-size:11px;color:var(--cyan);letter-spacing:2px;white-space:nowrap;flex-shrink:0}
  .card-id{font-size:18px;font-weight:800;color:#fff;letter-spacing:.5px;word-break:break-all;line-height:1.3}
  .card-images{padding:14px 20px 0;display:flex;flex-direction:column;gap:8px}
  .card-img-slot{background:#0d0d15;border:1px dashed rgba(255,255,255,0.08);overflow:hidden;transition:border-color .2s}
  .record-card:hover .card-img-slot{border-color:rgba(255,70,85,0.15)}
  .card-img-slot.has-image{border-style:solid;border-color:rgba(255,255,255,0.07)}
  .card-img-slot img{width:100%;height:auto;display:block;vertical-align:bottom}
  .card-img-slot:not(.has-image){min-height:180px;display:grid;place-items:center;cursor:pointer}
  .img-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-dim);pointer-events:none;user-select:none}
  .img-placeholder .cross{width:36px;height:36px;position:relative;opacity:.3}
  .img-placeholder .cross::before,.img-placeholder .cross::after{content:"";position:absolute;background:var(--steel)}
  .img-placeholder .cross::before{top:50%;left:0;right:0;height:1px;transform:translateY(-50%)}
  .img-placeholder .cross::after{left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%)}
  .img-placeholder .cross .ring{position:absolute;inset:3px;border:1px solid var(--steel);border-radius:50%;opacity:.5}
  .img-placeholder span{font-size:10px;letter-spacing:2px}
  .card-img-add{height:42px;border:1px dashed rgba(255,255,255,0.05);display:grid;place-items:center;cursor:pointer;transition:border-color .2s,background .2s}
  .card-img-add:hover{border-color:rgba(255,70,85,0.3);background:rgba(255,70,85,0.03)}
  .card-img-add span{font-size:20px;color:var(--text-dim);font-weight:200;line-height:1}
  .card-note{padding:12px 20px 18px;font-size:13px;color:var(--steel);line-height:1.7}
  .card-note:empty{display:none}
  .empty-state{text-align:center;padding:80px 20px;width:100%;color:var(--text-dim);font-family:var(--font-mono);font-size:13px;letter-spacing:2px;border:1px dashed rgba(255,255,255,0.06)}

  /* ── FAB ── */
  .fab{position:fixed;bottom:32px;right:32px;z-index:100;width:52px;height:52px;border-radius:2px;background:var(--red);border:none;cursor:pointer;display:grid;place-items:center;font-size:26px;color:#fff;font-weight:300;line-height:1;box-shadow:0 4px 20px rgba(255,70,85,0.35);transition:transform .15s,box-shadow .15s;clip-path:polygon(0% 0%,100% 0%,100% calc(100% - 6px),calc(100% - 6px) 100%,0% 100%,0% 0%)}
  .fab:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(255,70,85,0.5)}

  /* ── Modal ── */
  .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.75);display:grid;place-items:center;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-overlay.open{opacity:1;pointer-events:auto}
  .modal{background:var(--bg-card);border:1px solid var(--border);width:90vw;max-width:480px;max-height:90vh;overflow-y:auto;clip-path:polygon(0% 0%,100% 0%,100% calc(100% - 10px),calc(100% - 10px) 100%,0% 100%,0% 0%)}
  .modal-header{padding:24px 28px 0;display:flex;align-items:center;justify-content:space-between}
  .modal-header h2{font-size:16px;font-weight:800;color:#fff;letter-spacing:2px;font-family:var(--font-mono)}
  .modal-close{width:32px;height:32px;cursor:pointer;background:none;border:1px solid rgba(255,255,255,0.1);color:var(--text-dim);font-size:16px;display:grid;place-items:center;transition:border-color .2s,color .2s}
  .modal-close:hover{border-color:var(--red-dim);color:#fff}
  .modal-body{padding:24px 28px 28px;display:flex;flex-direction:column;gap:18px}
  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group label{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase}
  .form-group input,.form-group textarea{background:#0d0d15;border:1px solid rgba(255,255,255,0.08);padding:10px 14px;color:#fff;font-family:var(--font);font-size:15px;transition:border-color .2s;resize:vertical}
  .form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--red-dim)}
  .form-group textarea{min-height:70px}
  .form-hint{font-size:11px;color:var(--text-dim);font-family:var(--font-mono);letter-spacing:.5px}
  .form-row{display:flex;gap:10px}
  .form-row .btn-submit{flex:1}
  .btn-submit{padding:12px 0;background:var(--red);border:none;cursor:pointer;color:#fff;font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:3px;clip-path:polygon(0% 0%,100% 0%,100% calc(100% - 4px),calc(100% - 4px) 100%,0% 100%,0% 0%);transition:opacity .2s}
  .btn-submit:hover{opacity:.85}
  .btn-submit.gh{border:1px solid var(--green);background:transparent;color:var(--green)}
  .btn-submit.gh:hover{background:rgba(74,222,128,0.08);opacity:1}
  .btn-submit.gh:disabled{opacity:.35;cursor:not-allowed}
  .submit-divider{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:2px}
  .submit-divider::before,.submit-divider::after{content:"";flex:1;height:1px;background:var(--border)}
  .btn-test{font-family:var(--font-mono);font-size:10px;letter-spacing:2px;color:var(--text-dim);background:none;border:1px solid rgba(255,255,255,0.1);padding:6px 14px;cursor:pointer;transition:border-color .2s,color .2s;align-self:flex-start}
  .btn-test:hover{border-color:var(--green);color:var(--green)}
  .btn-test.ok{border-color:rgba(74,222,128,0.4);color:var(--green)}

  /* ── Toast ── */
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:300;pointer-events:none;font-family:var(--font-mono);font-size:12px;letter-spacing:1px;color:#fff;background:#1a1a25;border:1px solid var(--border);padding:10px 24px;opacity:0;transition:opacity .25s}
  .toast.show{opacity:1}
  .toast.error{border-color:var(--red-dim)}

  /* ── Footer ── */
  .site-footer{text-align:center;padding-top:40px;margin-top:24px;border-top:1px solid var(--border)}
  .site-footer p{font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--text-dim)}
  .dot{display:inline-block;width:6px;height:6px;background:var(--red);margin-right:8px;animation:pulse-dot 2s ease-in-out infinite}
  @keyframes pulse-dot{0%,100%{opacity:.3}50%{opacity:1}}

  /* ── 响应式 ── */
  @media(max-width:600px){
    .container{padding:24px 14px 60px}
    .modal{max-width:100vw}
    .modal-body{padding:20px 18px 24px}
    .modal-header{padding:20px 18px 0}
    .card-top{padding:14px 14px 0;gap:8px}
    .card-images{padding:10px 14px 0}
    .card-note{padding:10px 14px 14px}
    .card-id{font-size:16px}
    .fab{bottom:20px;right:20px;width:46px;height:46px}
    .header-actions{gap:6px}
  }
  @media(prefers-reduced-motion:reduce){
    .record-card,.record-card::before,.fab,.modal-overlay,.btn-hdr,.btn-icon{transition:none}
    .dot{animation:none;opacity:1}
  }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="container">

  <header class="site-header">
    <div class="header-left">
      <h1><span class="accent">炸鱼</span>观察记录</h1>
      <span class="meta">共 <strong id="recordCount">0</strong> 次遭遇</span>
    </div>
    <div class="header-actions">
      <span class="header-dot offline" id="ghDot" title="GitHub 状态"></span>
      <button class="btn-hdr" id="btnSync" style="display:none">拉取数据</button>
      <button class="btn-icon" id="btnSettings" title="GitHub 设置">&#9881;</button>
    </div>
  </header>

  <div class="masonry" id="masonry"></div>

  <footer class="site-footer">
    <p><span class="dot"></span>遇到新的炸鱼哥？点右下角 + 添加</p>
  </footer>

</div>

<!-- ════════════ FAB ════════════ -->
<button class="fab" id="fabAdd" title="添加记录">+</button>

<!-- ════════════ 添加记录 Modal ════════════ -->
<div class="modal-overlay" id="modalAdd">
  <div class="modal">
    <div class="modal-header">
      <h2>新增记录</h2>
      <button class="modal-close" id="modalAddClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="formDate">
      </div>
      <div class="form-group">
        <label>炸鱼哥 ID *</label>
        <input type="text" id="formId" placeholder="游戏内显示的 ID">
      </div>
      <div class="form-group">
        <label>截图路径</label>
        <input type="text" id="formImages" placeholder="images/a.jpg, images/b.jpg">
        <span class="form-hint">多个用逗号分隔，截图需手动放入仓库 images/ 文件夹</span>
      </div>
      <div class="form-group">
        <label>备注</label>
        <textarea id="formNote" placeholder="可选：简单描述当时情况"></textarea>
      </div>

      <div class="submit-divider">提交方式</div>

      <div class="form-row">
        <button class="btn-submit" id="btnSubmitLocal">保存到本地</button>
        <button class="btn-submit gh" id="btnSubmitGH" disabled>提交到 GitHub</button>
      </div>
      <span class="form-hint" id="ghHint" style="text-align:center">配置 GitHub 设置后可使用一键提交</span>
    </div>
  </div>
</div>

<!-- ════════════ GitHub 设置 Modal ════════════ -->
<div class="modal-overlay" id="modalSettings">
  <div class="modal">
    <div class="modal-header">
      <h2>GitHub 设置</h2>
      <button class="modal-close" id="modalSettingsClose">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="ghOwner" placeholder="你的 GitHub 用户名">
      </div>
      <div class="form-group">
        <label>仓库名</label>
        <input type="text" id="ghRepo" placeholder="仓库名">
      </div>
      <div class="form-group">
        <label>分支</label>
        <input type="text" id="ghBranch" placeholder="main">
      </div>
      <div class="form-group">
        <label>Personal Access Token</label>
        <input type="password" id="ghToken" placeholder="ghp_...">
        <span class="form-hint">需勾选 Contents 读写权限。Token 仅存于浏览器 localStorage</span>
      </div>
      <button class="btn-test" id="btnTestGH">测试连接</button>
      <button class="btn-submit" id="btnSaveSettings" style="margin-top:4px">保存设置</button>
    </div>
  </div>
</div>

<!-- ════════════ Toast ════════════ -->
<div class="toast" id="toast"></div>

<script>
/* ================================================================
   State
   ================================================================ */
const LS_DRAFTS  = "smurf_log_drafts";
const LS_GH      = "smurf_log_gh";
const GAP        = 20;
const COL_MIN    = 340;
const GH_API     = "https://api.github.com";

const INLINE = [
  {date:"2026-05-09",id:"击杀王#12345",images:[],note:"竞技模式击杀异常偏高，全程无沟通，怀疑开挂"},
  {date:"2026-05-08",id:"Xx_SmurfMaster_xX",images:[],note:""},
  {date:"2026-05-07",id:"别打我头#666",images:[],note:"连续三局 ACS > 400，队友举报后仍在排位中活跃"},
  {date:"2026-05-06",id:"TwitchTV_ProMax",images:[],note:"直播标题写着「帮粉丝上分」"},
  {date:"2026-05-05",id:"瞄准全靠锁#999",images:[],note:""},
];

let baseRecords  = [];
let localRecords = [];
let ghSettings   = null; // {owner,repo,branch,token} | null

/* ================================================================
   Init
   ================================================================ */
(async function init(){
  loadGhSettings();
  await loadBase();
  loadDrafts();
  render();
  bindEvents();
  updateGhUI();
  window.addEventListener("resize",debounce(render,200));
})();

async function loadBase(){
  try {
    const r=await fetch("records.json?"+Date.now());
    if(r.ok){baseRecords=await r.json();return}
  }catch(_){}
  baseRecords=INLINE;
}

/* ── GitHub 设置 ── */
function loadGhSettings(){
  try{ghSettings=JSON.parse(localStorage.getItem(LS_GH))}catch(_){ghSettings=null}
  if(!ghSettings||!ghSettings.token)ghSettings=null;
}

function saveGhSettings(s){
  ghSettings=s;
  localStorage.setItem(LS_GH,JSON.stringify(s));
}

/* ── localStorage ── */
function loadDrafts(){
  try{localRecords=JSON.parse(localStorage.getItem(LS_DRAFTS)||"[]")}catch(_){localRecords=[]}
}
function saveDrafts(){localStorage.setItem(LS_DRAFTS,JSON.stringify(localRecords))}

/* ================================================================
   GitHub API
   ================================================================ */
function ghHeaders(){
  return {
    Authorization:"Bearer "+ghSettings.token,
    Accept:"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28"
  };
}

async function ghGetFile(){
  const{owner,repo,branch}=ghSettings;
  const url=GH_API+"/repos/"+owner+"/"+repo+"/contents/records.json?ref="+branch;
  const r=await fetch(url,{headers:ghHeaders()});
  if(!r.ok)throw new Error("GET records.json → "+r.status);
  const d=await r.json();
  return{content:JSON.parse(atob(d.content)),sha:d.sha};
}

async function ghPutFile(content,sha,msg){
  const{owner,repo,branch}=ghSettings;
  const url=GH_API+"/repos/"+owner+"/"+repo+"/contents/records.json";
  const body={
    message:msg||"新增炸鱼记录",
    content:btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)+"\n"))),
    sha,branch
  };
  const r=await fetch(url,{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)});
  if(!r.ok)throw new Error("PUT records.json → "+r.status);
  return r.json();
}

async function ghTestConnection(){
  const{owner,repo}=ghSettings;
  const url=GH_API+"/repos/"+owner+"/"+repo;
  const r=await fetch(url,{headers:ghHeaders()});
  return r.ok;
}

/* ================================================================
   Render
   ================================================================ */
function render(){
  const all=baseRecords.concat(localRecords);
  document.getElementById("recordCount").textContent=all.length;

  const masonry=document.getElementById("masonry");
  const avail=masonry.clientWidth;
  const cols=Math.max(1,Math.floor((avail+GAP)/(COL_MIN+GAP)));

  masonry.innerHTML="";
  if(all.length===0){
    masonry.innerHTML='<div class="empty-state">暂无记录，遇到炸鱼哥后点右下角 + 添加</div>';
    return;
  }

  const colDivs=[];
  for(let i=0;i<cols;i++){
    const col=document.createElement("div");
    col.className="masonry-col";
    masonry.appendChild(col);
    colDivs.push(col);
  }

  all.forEach(function(r,idx){
    const isDraft=idx>=baseRecords.length;
    const card=buildCard(r,isDraft);
    let minIdx=0,minH=colDivs[0].scrollHeight;
    for(let i=1;i<cols;i++){const h=colDivs[i].scrollHeight;if(h<minH){minH=h;minIdx=i}}
    colDivs[minIdx].appendChild(card);
  });
}

function buildCard(r,isDraft){
  const card=document.createElement("article");
  card.className="record-card"+(isDraft?" is-draft":"");
  const tag=isDraft?'<div class="card-draft-tag">草稿</div>':"";
  const slots=buildImageSlots(r.images);
  const note=r.note?'<div class="card-note">'+esc(r.note)+'</div>':"";
  card.innerHTML=tag+
    '<div class="card-top"><span class="card-date">'+esc(r.date)+'</span><span class="card-id">'+esc(r.id)+'</span></div>'+
    '<div class="card-images">'+slots+'</div>'+note;
  return card;
}

function buildImageSlots(images){
  const imgs=images||[];
  let h="";
  if(imgs.length===0){
    h+='<div class="card-img-slot"><div class="img-placeholder"><div class="cross"><div class="ring"></div></div><span>添加截图</span></div></div>';
  }else{
    imgs.forEach(function(s){
      h+='<div class="card-img-slot has-image"><img src="'+esc(s)+'" alt="截图" loading="lazy"></div>';
    });
  }
  h+='<div class="card-img-add"><span>+</span></div>';
  return h;
}

/* ── 更新 GitHub UI 状态 ── */
function updateGhUI(){
  var dot=document.getElementById("ghDot");
  var btnSync=document.getElementById("btnSync");
  var btnGH=document.getElementById("btnSubmitGH");
  var hint=document.getElementById("ghHint");

  if(ghSettings){
    dot.className="header-dot online";
    dot.title="GitHub 已连接";
    btnSync.style.display="";
    btnGH.disabled=false;
    btnGH.textContent="提交到 GitHub";
    hint.textContent="将直接写入 "+ghSettings.owner+"/"+ghSettings.repo;
  }else{
    dot.className="header-dot offline";
    dot.title="GitHub 未连接 — 点击齿轮设置";
    btnSync.style.display="none";
    btnGH.disabled=true;
    btnGH.textContent="提交到 GitHub";
    hint.textContent="配置 GitHub 设置后可使用一键提交";
  }
}

/* ================================================================
   Events
   ================================================================ */
function bindEvents(){
  document.getElementById("fabAdd").addEventListener("click",openAddModal);
  document.getElementById("modalAddClose").addEventListener("click",function(){closeModal("modalAdd")});
  document.getElementById("modalAdd").addEventListener("click",function(e){if(e.target===this)closeModal("modalAdd")});

  document.getElementById("btnSettings").addEventListener("click",openSettingsModal);
  document.getElementById("modalSettingsClose").addEventListener("click",function(){closeModal("modalSettings")});
  document.getElementById("modalSettings").addEventListener("click",function(e){if(e.target===this)closeModal("modalSettings")});

  document.getElementById("btnSubmitLocal").addEventListener("click",submitLocal);
  document.getElementById("btnSubmitGH").addEventListener("click",submitToGH);
  document.getElementById("btnSaveSettings").addEventListener("click",saveSettings);
  document.getElementById("btnTestGH").addEventListener("click",testConnection);
  document.getElementById("btnSync").addEventListener("click",syncFromGH);

  document.getElementById("masonry").addEventListener("click",handleImageClick);

  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){
      closeModal("modalAdd");
      closeModal("modalSettings");
    }
  });
}

/* ── Modal 开关 ── */
function openAddModal(){
  document.getElementById("formDate").value=today();
  document.getElementById("formId").value="";
  document.getElementById("formImages").value="";
  document.getElementById("formNote").value="";
  document.getElementById("modalAdd").classList.add("open");
  updateGhUI();
  setTimeout(function(){document.getElementById("formId").focus()},150);
}

function closeModal(id){document.getElementById(id).classList.remove("open")}

function openSettingsModal(){
  if(ghSettings){
    document.getElementById("ghOwner").value=ghSettings.owner||"";
    document.getElementById("ghRepo").value=ghSettings.repo||"";
    document.getElementById("ghBranch").value=ghSettings.branch||"main";
    document.getElementById("ghToken").value=ghSettings.token||"";
  }
  document.getElementById("modalSettings").classList.add("open");
}

/* ── 保存设置 ── */
function saveSettings(){
  var s={
    owner:document.getElementById("ghOwner").value.trim(),
    repo:document.getElementById("ghRepo").value.trim(),
    branch:document.getElementById("ghBranch").value.trim()||"main",
    token:document.getElementById("ghToken").value.trim()
  };
  if(!s.owner||!s.repo||!s.token){toast("请填写用户名、仓库名和 Token","error");return}
  saveGhSettings(s);
  updateGhUI();
  closeModal("modalSettings");
  toast("GitHub 设置已保存");
}

/* ── 测试连接 ── */
async function testConnection(){
  var s={
    owner:document.getElementById("ghOwner").value.trim(),
    repo:document.getElementById("ghRepo").value.trim(),
    token:document.getElementById("ghToken").value.trim()
  };
  if(!s.owner||!s.repo||!s.token){toast("请先填写用户名、仓库名和 Token","error");return}

  var old=ghSettings;
  ghSettings={owner:s.owner,repo:s.repo,branch:"main",token:s.token};
  var btn=document.getElementById("btnTestGH");
  btn.textContent="测试中...";
  try{
    var ok=await ghTestConnection();
    if(ok){btn.textContent="连接成功 ✓";btn.classList.add("ok");toast("GitHub 连接成功")}
    else{btn.textContent="连接失败";btn.classList.remove("ok");toast("连接失败，请检查信息","error")}
  }catch(e){
    btn.textContent="连接失败";btn.classList.remove("ok");toast("连接失败："+e.message,"error");
  }
  ghSettings=old;
}

/* ── 提交到本地 ── */
function submitLocal(){
  var record=readForm();
  if(!record)return;
  localRecords.push(record);
  saveDrafts();
  render();
  closeModal("modalAdd");
  toast("已保存到本地缓存");
}

/* ── 提交到 GitHub ── */
async function submitToGH(){
  if(!ghSettings){toast("请先配置 GitHub 设置","error");return}
  var record=readForm();
  if(!record)return;

  var btn=document.getElementById("btnSubmitGH");
  btn.disabled=true;btn.textContent="提交中...";

  try{
    // 拉取最新文件
    var{content,sha}=await ghGetFile();
    // 追加
    content.push(record);
    // 提交
    await ghPutFile(content,sha,"新增炸鱼记录: "+record.id);
    // 刷新本地数据
    baseRecords=content;
    render();
    closeModal("modalAdd");
    toast("已提交到 GitHub → "+ghSettings.owner+"/"+ghSettings.repo);
  }catch(e){
    toast("提交失败："+e.message,"error");
  }
  btn.disabled=false;btn.textContent="提交到 GitHub";
}

/* ── 从 GitHub 同步 ── */
async function syncFromGH(){
  if(!ghSettings)return;
  var btn=document.getElementById("btnSync");
  btn.textContent="拉取中...";btn.disabled=true;
  try{
    var{content}=await ghGetFile();
    baseRecords=content;
    localRecords=[];
    saveDrafts();
    render();
    toast("已从 GitHub 同步最新数据");
  }catch(e){toast("同步失败："+e.message,"error")}
  btn.textContent="拉取数据";btn.disabled=false;
}

/* ── 读表单 ── */
function readForm(){
  var id=document.getElementById("formId").value.trim();
  if(!id){document.getElementById("formId").style.borderColor="var(--red)";document.getElementById("formId").focus();return null}
  document.getElementById("formId").style.borderColor="";
  var imgs=document.getElementById("formImages").value.trim();
  return{
    date:document.getElementById("formDate").value||today(),
    id:id,
    images:imgs?imgs.split(",").map(function(s){return s.trim()}):[],
    note:document.getElementById("formNote").value.trim()
  };
}

/* ── 图片上传 ── */
function handleImageClick(e){
  var p=e.target.closest(".card-img-slot:not(.has-image)");
  var a=e.target.closest(".card-img-add");
  if(!p&&!a)return;
  var inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=function(){
    var f=inp.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var img=document.createElement("img");img.src=r.result;img.alt="截图";
      if(p){p.innerHTML="";p.appendChild(img);p.classList.add("has-image")}
      else if(a){var s=document.createElement("div");s.className="card-img-slot has-image";s.appendChild(img);a.parentNode.insertBefore(s,a)}
      img.onload=function(){render()};
    };r.readAsDataURL(f);
  };inp.click();
}

/* ── Toast ── */
var _tt;
function toast(msg,type){
  var el=document.getElementById("toast");
  el.textContent=msg;el.className="toast show"+(type==="error"?" error":"");
  clearTimeout(_tt);_tt=setTimeout(function(){el.classList.remove("show")},3500);
}

/* ── Utils ── */
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){var d=document.createElement("div");d.appendChild(document.createTextNode(s||""));return d.innerHTML}
function debounce(fn,ms){var t;return function(){clearTimeout(t);t=setTimeout(fn,ms)}}
</script>
